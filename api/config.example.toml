# Global application configuration for api/config.toml.
# This file is required at runtime.

[server]
listen_ip = "0.0.0.0"
listen_port = 8080
worker_count = 4

[security]
environment_token_encryption_key = "your-32-byte-hex-key-here"

[authentication]
username = "admin"
password = "password"
secure_cookie = false

[database]
url = "postgres://gitlab_ci_dashboard:gitlab_ci_dashboard@postgres:5432/gitlab_ci_dashboard"
max_connections = 10

[analytics]
enabled = true
sync_interval_seconds = 300
retention_days = 30

[cache]
group_ttl_seconds = 300
project_ttl_seconds = 300
branch_ttl_seconds = 60
job_ttl_seconds = 60
pipeline_ttl_seconds = 300
schedule_ttl_seconds = 300
runner_ttl_seconds = 60
runner_detail_ttl_seconds = 300
runner_job_ttl_seconds = 15
artifact_ttl_seconds = 1800

[pipeline]
history_days = 30

[ui]
read_only = true
hide_write_actions = false
page_size_options = [10, 20, 30, 40, 50]
default_page_size = 10
