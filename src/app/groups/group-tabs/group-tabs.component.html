@if (loading()) {
  <div class="spinner"><nz-spin /></div>
} @else {
  @if (selectedGroup(); as group) {
    <gcd-feature-tabs [groupMap]="selectedGroupMap()" [groupName]="group.name" [availableGroups]="groups()" (environmentsChanged)="onEnvironmentsChanged()" />
  } @else {
    <gcd-feature-tabs [groupMap]="emptyGroupMap" groupName="No environment configured" [availableGroups]="groups()" [emptyState]="true" (environmentsChanged)="onEnvironmentsChanged()" />
  }
}
