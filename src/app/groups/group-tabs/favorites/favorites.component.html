@if (hasFavorites()) {
  <gcd-pipelines [groupMap]="favorites()" [favoritesMode]="true" />
} @else {
  <section class="favorites-empty">
    <span nz-icon nzType="star"></span>
    <h2>No favorite projects yet</h2>
    <p>Add a project with the star icon in the Pipelines table, then it will appear here.</p>
  </section>
}
