<div class="flex items-center">
  <div class="max-width-275">
    <nz-input-group [nzPrefix]="prefixIcon" [nzSuffix]="suffixIcon">
      <input
        type="text"
        [(ngModel)]="filterText"
        nz-input
        [placeholder]="projectCount() > 0 ? 'Search ' + projectCount() + ' projects...' : 'Search projects...'"
      />
    </nz-input-group>
    <ng-template #prefixIcon><span nz-icon nzType="search"></span></ng-template>
    <ng-template #suffixIcon>
      @if(filterText()){<button type="button" class="filter-clear-button" nz-tooltip nzTooltipTitle="Clear search" aria-label="Clear project search" (click)="filterText.set('')"><span nz-icon nzType="close"></span></button>}
    </ng-template>
  </div>
</div>
