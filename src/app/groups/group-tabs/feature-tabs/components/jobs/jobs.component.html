<div>
  @if (loading()) {
    <nz-spin nzSize="small" />
  } @else if (tags().length) {
    @for (tag of tags(); track trackById(tag.job)) {
      <nz-tag
        class="pointer job-badge"
        (click)="onActionClick($event, tag.job)"
        [style.--job-color]="getStatus(tag.job) | statusColor"
        nz-tooltip
        [nzTooltipTitle]="'Show ' + (tag.downstream ? 'downstream ' : '') + 'job (' + tag.job.name + ')'"
      >
        @if (tag.downstream) {
          <span aria-label="Downstream job">↳</span>
        }
        <span nz-icon [nzType]="tag.icon" [nzSpin]="tag.spin"></span>
        <span>{{ tag.job.name | maxLength: 12 }}</span>
      </nz-tag>
    }
  } @else {
    -
  }
</div>
