<header class="header">
  <div class="dashboard-brand"><span class="dashboard-mark" aria-hidden="true">@if(config.companyLogo()){<img [src]="config.companyLogo()" alt="" />}@else{<span>CI</span>}</span><span class="dashboard-copy"><strong>{{config.companyName()}}</strong><small>GitLab CI Dashboard</small></span></div>
  @if (auth.authenticated()) { <div class="header-actions"><button nzType="text" nz-button (click)="theme.toggle()"><span nz-icon [nzType]="theme.isDracula() ? 'sun' : 'moon'"></span><span class="action-label">{{ theme.isDracula() ? 'Light' : 'Dracula' }}</span></button>@if (auth.enabled()) { <button nzType="text" nz-button (click)="auth.logout()"><span nz-icon nzType="logout"></span><span class="action-label">Sign out</span></button> }<span class="header-divider"></span><button nzType="text" nz-button (click)="onClick()"><span class="font-md font-white" nz-icon nzType="github"></span></button></div> }
</header>
